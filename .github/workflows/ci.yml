name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: consensus
          POSTGRES_PASSWORD: consensus
          POSTGRES_DB: consensus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U consensus -d consensus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://consensus:consensus@localhost:5432/consensus_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t consensus:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f frontend/package.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm ci && npm run lint && npm run build
