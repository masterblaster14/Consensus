<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Consensus keeps your coding agents from stepping on each other — shared claims, conflict arbitration and a memory every agent reads."
    />
    <title>Consensus — one mind for many agents</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong
      // palette. ThemeProvider takes over from here.
      (function () {
        try {
          var stored = localStorage.getItem('consensus.theme')
          if (stored !== 'light' && stored !== 'dark') {
            stored = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          }
          document.documentElement.setAttribute('data-theme', stored)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
