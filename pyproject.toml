[project]
name = "consensus"
version = "0.1.0"
description = "Coordination service for AI coding agents: declare plans, detect conflicts, share memory."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "mcp>=2.0",
  "anthropic>=1.0",
  "openai>=1.50",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyjwt>=2.8",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "websockets>=12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
