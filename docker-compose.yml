services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: consensus-postgres
    environment:
      POSTGRES_USER: consensus
      POSTGRES_PASSWORD: consensus
      POSTGRES_DB: consensus
    ports:
      - "5432:5432"
    volumes:
      - consensus_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensus -d consensus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: consensus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The backend itself. Off by default so `docker compose up -d` still gives you just the
  # databases for local development. Run everything with: docker compose --profile full up -d
  app:
    build: .
    container_name: consensus-app
    profiles: ["full"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://consensus:consensus@postgres:5432/consensus
      REDIS_URL: redis://redis:6379
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  consensus_pgdata:
